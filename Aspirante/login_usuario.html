<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Aspirante - Sistema de Inscripción</title>
</head>
<body>
    <header align="center">
        <h1>Ingreso de Aspirantes</h1>
        <h3>Sistema de Inscripción Docente</h3>
        <hr width="60%">
    </header>
    
    <br><br>
    
    <main align="center">
        <fieldset style="width: 400px; margin: auto;">
            <legend><strong>Iniciar Sesión</strong></legend>
            
            <form action="menu_usuario.html" method="get">
                <br>
                
                <p align="left">
                    <label for="nombre">Nombre Completo:</label><br>
                    <input type="text" id="nombre" name="nombre" size="40" 
                           placeholder="Ingrese su nombre completo" required>
                </p>
                
                <p align="left">
                    <label for="cedula">Número de Cédula:</label><br>
                    <input type="text" id="cedula" name="cedula" size="40" 
                           placeholder="Ingrese su número de cédula" required>
                </p>
                
                <p align="left">
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" size="40" 
                           placeholder="Ingrese su contraseña" required>
                </p>
                
                <br>
                
                <p>
                    <input type="submit" value="INGRESAR">
                </p>
                
                <br>
                
                <p>
                    <small>¿Primera vez aquí? Al ingresar podrá registrarse</small>
                </p>
            </form>
        </fieldset>
        
        <br><br>
        
        <p>
            <a href="../Inicio/inicio.html">← Volver al inicio</a>
        </p>
    </main>
    
    <br><br>
    
    <footer align="center">
        <hr width="60%">
        <p><small>© 2026 Escuela de Policía Rafael Reyes</small></p>
    </footer>
</body>
</html>
