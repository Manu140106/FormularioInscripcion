<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Funcionario - Sistema de Inscripción</title>
</head>
<body>
    <header align="center">
        <h1>Ingreso de Funcionarios</h1>
        <h3>Sistema de Inscripción Docente</h3>
        <hr width="60%">
    </header>
    
    <br><br>
    
    <main align="center">
        <fieldset style="width: 400px; margin: auto;">
            <legend><strong>Iniciar Sesión - Administrativo</strong></legend>
            
            <form action="panel_funcionario.html" method="get">
                <br>
                
                <p align="left">
                    <label for="usuario">Usuario:</label><br>
                    <input type="text" id="usuario" name="usuario" size="40" 
                           placeholder="Nombre de usuario" required>
                </p>
                
                <p align="left">
                    <label for="password">Contraseña:</label><br>
                    <input type="password" id="password" name="password" size="40" 
                           placeholder="Contraseña" required>
                </p>
                
                <p align="left">
                    <label for="area">Área:</label><br>
                    <select id="area" name="area" style="width: 100%;" required>
                        <option value="">-- Seleccione su área --</option>
                        <option value="secretaria">Secretaría Académica</option>
                        <option value="recursos_humanos">Recursos Humanos</option>
                        <option value="coordinacion">Coordinación de Docencia</option>
                        <option value="direccion">Dirección</option>
                    </select>
                </p>
                
                <br>
                
                <p>
                    <input type="submit" value="INGRESAR AL SISTEMA">
                </p>
                
                <br>
            </form>
        </fieldset>
        
        <br><br>
        
        <p>
            <a href="../Inicio/inicio.html">← Volver al inicio</a>
        </p>
    </main>
    
    <br><br>
    
    <footer align="center">
        <hr width="60%">
        <p><small>© 2026 Escuela de Policía Rafael Reyes</small></p>
    </footer>
</body>
</html>
